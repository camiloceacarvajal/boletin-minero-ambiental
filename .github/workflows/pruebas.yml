name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install -q requests beautifulsoup4 lxml jinja2

      - name: Pruebas que no necesitan red
        # La base no existe en un checkout limpio: pruebas.py detecta eso y
        # corre solo las unitarias, que son la mayoría.
        run: python3 pruebas.py

      - name: El curado es JSON válido y sin roles repetidos
        run: |
          python3 - <<'PY'
          import json, collections, sys
          d = json.load(open("datos/curado.json"))
          claves = [(r["fuente"], r["rol"]) for r in d]
          rep = [k for k, n in collections.Counter(claves).items() if n > 1]
          print(f"{len(d)} sentencias curadas, {len(set(claves))} claves únicas")
          if rep:
              print("REPETIDAS:", rep[:5]); sys.exit(1)
          sys.path.insert(0, ".")
          from boletin.curado import CAMPOS
          vacias = [r for r in d if not any(c in r for c in CAMPOS)]
          if vacias:
              print(f"{len(vacias)} entradas sin ningún dato curado:", vacias[:3])
              sys.exit(1)
          print(f"sin entradas vacías (campos válidos: {', '.join(CAMPOS)})")
          PY

      - name: Los respaldos de raspado están completos
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from boletin.fuentes import FUENTES
          for fuente in FUENTES:
              ruta = Path("datos/raspado") / f"{fuente}.json"
              if not ruta.exists():
                  print(f"falta el respaldo de {fuente}"); sys.exit(1)
              d = json.loads(ruta.read_text())
              sin_rol = [r for r in d if not r.get("rol")]
              print(f"  {fuente}: {len(d)} sentencias")
              if not d or sin_rol:
                  print(f"  respaldo de {fuente} vacío o con filas sin rol"); sys.exit(1)
          PY
